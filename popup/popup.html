<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频实时字幕</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>视频实时字幕</h1>
      <p class="sub-title">准确率优先：本地实时预览 + 云端终稿校正（可切换纯本地/纯云端）</p>
    </header>

    <section class="controls" aria-label="操作区">
      <button id="startBtn" class="btn btn-primary">启动实时字幕</button>
      <button id="stopBtn" class="btn btn-danger">停止</button>
    </section>

    <section class="settings" aria-label="识别设置">
      <label class="field" for="providerSelect">
        <span>识别引擎</span>
        <select id="providerSelect">
          <option value="hybrid">混合（准确率优先）</option>
          <option value="cloud">纯云端（高准确）</option>
          <option value="local">纯本地（离线）</option>
        </select>
      </label>
      <label id="localModelField" class="field" for="modelSelect">
        <span>本地模型</span>
        <select id="modelSelect"></select>
      </label>
    </section>

    <section class="settings" aria-label="字幕参数">
      <label class="field" for="modeSelect">
        <span>字幕模式</span>
        <select id="modeSelect">
          <option value="live">实时（低延迟）</option>
          <option value="accurate">准确（高延迟）</option>
        </select>
      </label>
      <label id="cloudLanguageField" class="field" for="cloudLanguageSelect">
        <span>云端语言</span>
        <select id="cloudLanguageSelect">
          <option value="zh">中文（推荐）</option>
          <option value="auto">自动检测</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
        </select>
      </label>
    </section>

    <section id="cloudModelSection" class="settings" aria-label="云端模型">
      <label class="field" for="cloudModelInput">
        <span>云端模型</span>
        <input id="cloudModelInput" type="text" value="whisper-1" placeholder="如 whisper-1">
      </label>
      <label class="field" for="cloudApiBaseInput">
        <span>API Base</span>
        <input id="cloudApiBaseInput" type="text" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1">
      </label>
    </section>

    <section id="cloudKeySection" class="settings" aria-label="云端密钥">
      <label class="field field-full" for="cloudApiKeyInput">
        <span>云端 API Key（本地存储）</span>
        <input id="cloudApiKeyInput" type="password" placeholder="sk-...">
      </label>
    </section>

    <section class="status-panel" aria-live="polite">
      <div id="status" class="status-text">正在初始化...</div>
      <div class="status-meta">
        <span id="engineTag" class="meta-pill">引擎: Whisper</span>
        <span id="latencyTag" class="meta-pill">延迟: -</span>
        <span id="countTag" class="meta-pill">字幕: 0</span>
      </div>
    </section>

    <section class="subtitle-wrap">
      <div id="subtitleList" class="subtitle-list"></div>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
